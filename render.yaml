services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: financial-reconciler-backend
    env: python
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt && python create_sample_data.py
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"

  # 2. React Frontend Static Site
  - type: web
    name: financial-reconciler-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: financial-reconciler-backend
          property: host
