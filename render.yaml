services:
  # Single Unified Service: Serves both React Web UI & FastAPI Backend from one link!
  - type: web
    name: financial-account-reconciler
    env: python
    region: oregon
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && python -m pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && python create_sample_data.py
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
